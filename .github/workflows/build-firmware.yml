# Freeze AlLoRa into per-target MicroPython firmware, one .bin per target as a workflow artifact.
# release.yml calls this and attaches the .bin files to the release once PyPI has the package.
# Runs in Espressif's ESP-IDF container, so no toolchain is installed by hand — a target is one
# matrix row + one folder under firmware/targets/ (see firmware/README.md).
#
# A manual run (workflow_dispatch) builds both targets from the branch picked. The version pins
# below are best-effort (a MicroPython release supports specific ESP-IDF versions; bump the two
# together). The original hand-build used ESP-IDF v5.1.2 + the
# network_common.c WIFI_AUTH patch; this defaults to a newer pair with the patch off. If a build
# fails on the IDF version or the WIFI_AUTH assert, adjust the matrix row (flip apply_wifi_auth_patch).

name: Build AlLoRa firmware

on:
  # A push to main that touches the firmware recipe or this workflow builds both targets, so a
  # broken recipe shows before release day. Scoped so protocol commits don't each start a build.
  push:
    branches: [main]
    paths:
      - "firmware/**"
      - ".github/workflows/build-firmware.yml"
  workflow_dispatch:          # manual
  # A published release runs this through release.yml, after the version check and the tests,
  # so a release never carries firmware from a tree whose suite is red.
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.idf_image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: t3s3-sx127x
            board: ESP32_GENERIC_S3
            driver: PyLora_SX127x_extensions
            micropython_ref: v1.24.1
            idf_image: espressif/idf:v5.2.2
            apply_wifi_auth_patch: "false"
          - target: t3s3-sx1262
            board: ESP32_GENERIC_S3
            driver: sx1262
            micropython_ref: v1.24.1
            idf_image: espressif/idf:v5.2.2
            apply_wifi_auth_patch: "false"
    steps:
      - name: Trust the workspace (container runs as root)
        run: git config --global --add safe.directory '*'

      - name: Check out AlLoRa (the recipe + the package to freeze)
        uses: actions/checkout@v4

      - name: Check out MicroPython (pinned per target)
        uses: actions/checkout@v4
        with:
          repository: micropython/micropython
          ref: ${{ matrix.micropython_ref }}
          path: micropython
          submodules: recursive   # fetch berkeley-db (btree) etc.; `make submodules` alone misses some

      - name: Assemble the board overlay + frozen module bundle
        run: |
          set -eux
          TARGET_DIR="firmware/targets/${{ matrix.target }}"
          MP_BOARD_DIR="micropython/ports/esp32/boards/${{ matrix.board }}"
          # board overlay (sdkconfig.board, mpconfigboard.{h,cmake}, manifest.py)
          cp -r "$TARGET_DIR/boards/${{ matrix.board }}/." "$MP_BOARD_DIR/"
          # freeze bundle -> boards/<BOARD>/modules/ : AlLoRa (live) + chip driver + board helpers
          mkdir -p "$MP_BOARD_DIR/modules"
          cp -r AlLoRa "$MP_BOARD_DIR/modules/"
          # A driver with an __init__.py is a package and is imported by its directory name
          # (PyLora_SX127x_extensions.pyLora); one without is a set of loose modules that
          # import each other by bare name (sx1262 -> sx126x -> _sx126x), so it has to land at
          # the top of the bundle or none of those imports resolve. Copy each accordingly.
          DRIVER_DIR="firmware/drivers/${{ matrix.driver }}"
          if [ -f "$DRIVER_DIR/__init__.py" ]; then
            cp -r "$DRIVER_DIR" "$MP_BOARD_DIR/modules/"
          else
            cp "$DRIVER_DIR"/*.py "$MP_BOARD_DIR/modules/"
          fi
          cp -r "$TARGET_DIR/modules/." "$MP_BOARD_DIR/modules/"

      - name: Pin espressif/tinyusb (reproducible USB descriptors)
        working-directory: micropython/ports/esp32
        run: |
          set -e
          . "$IDF_PATH/export.sh"   # put the ESP-IDF venv python (which has pyyaml) on PATH
          # MicroPython pins espressif/esp_tinyusb to 1.0.3, whose usb_descriptors.c references
          # CFG_TUD_CDC_EP_BUFSIZE. espressif/tinyusb 0.21.0 removed that macro, so a fresh
          # transitive resolve turns the build red on an untouched recipe. Pin tinyusb to the
          # last-good 0.19.0~3 (the version the last green firmware build used) so the managed
          # component set is reproducible. Follow-up: move to the latest supported MicroPython +
          # ESP-IDF pair, which ships a self-consistent esp_tinyusb/tinyusb and retires this pin.
          python3 - <<'PY'
          import os, yaml
          PIN = "==0.19.0~3"
          patched = []
          for root, _dirs, files in os.walk("."):
              if "idf_component.yml" not in files:
                  continue
              path = os.path.join(root, "idf_component.yml")
              with open(path) as f:
                  text = f.read()
              if "esp_tinyusb" not in text:
                  continue
              doc = yaml.safe_load(text) or {}
              deps = doc.setdefault("dependencies", {})
              deps["espressif/tinyusb"] = PIN
              with open(path, "w") as f:
                  yaml.safe_dump(doc, f, sort_keys=False)
              patched.append(path)
          if not patched:
              raise SystemExit("no idf_component.yml declared esp_tinyusb; tinyusb pin not applied")
          print("pinned espressif/tinyusb", PIN, "in:", patched)
          PY

      - name: Compatibility patch (ESP-IDF v5.1.2 WIFI_AUTH_MAX)
        if: matrix.apply_wifi_auth_patch == 'true'
        run: |
          set -eux
          sed -i 's/WIFI_AUTH_MAX == 10/WIFI_AUTH_MAX == 11/' \
            micropython/ports/esp32/network_common.c

      - name: Build mpy-cross
        run: |
          . "$IDF_PATH/export.sh"
          make -C micropython/mpy-cross

      - name: Fetch esp32 submodules
        working-directory: micropython/ports/esp32
        run: |
          . "$IDF_PATH/export.sh"
          make submodules BOARD=${{ matrix.board }}

      - name: Build firmware
        working-directory: micropython/ports/esp32
        run: |
          . "$IDF_PATH/export.sh"
          make BOARD=${{ matrix.board }}

      - name: Collect the .bin
        run: |
          set -eux
          cp "micropython/ports/esp32/build-${{ matrix.board }}/firmware.bin" \
             "AlLoRa-${{ matrix.target }}-firmware.bin"

      - name: Upload as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: AlLoRa-${{ matrix.target }}-firmware
          path: AlLoRa-${{ matrix.target }}-firmware.bin
